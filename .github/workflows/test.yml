name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so an inspect-ai release that breaks the private HuggingFaceAPI
    # surface we subclass shows up here rather than in a user's run.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . --group dev

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Test
        run: uv run pytest -q

  # Separate job, allowed to fail: it tells us an upstream release has moved the
  # private module we subclass, without blocking a PR that is otherwise fine.
  latest-inspect:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install with the newest inspect-ai
        run: |
          uv venv --python 3.12
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . --group dev
          uv pip install --upgrade inspect-ai

      - name: Report the version under test
        run: uv run python -c "import inspect_ai; print('inspect-ai', inspect_ai.__version__)"

      - name: Test
        run: uv run pytest -q
