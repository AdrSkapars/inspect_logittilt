[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspect-logittilt"
version = "0.1.0"
description = "LogitTilt behaviour elicitation as an Inspect AI model provider."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Adrians Skapars" }]
keywords = ["inspect", "ai-safety", "auditing", "red-teaming", "elicitation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "inspect-ai>=0.3.0",
    "torch",
    "transformers",
    "accelerate",  # transformers needs it for the device_map path inspect's hf provider uses
]

[project.urls]
Homepage = "https://github.com/AdrSkapars/inspect_logittilt"
Repository = "https://github.com/AdrSkapars/inspect_logittilt"
Issues = "https://github.com/AdrSkapars/inspect_logittilt/issues"
Changelog = "https://github.com/AdrSkapars/inspect_logittilt/blob/main/CHANGELOG.md"

# Inspect imports this on startup and picks up whatever it registers.
# https://inspect.aisi.org.uk/extensions.html
[project.entry-points.inspect_ai]
inspect_logittilt = "inspect_logittilt._registry"

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_logittilt"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# vendored third-party Quarto template; not ours to reformat
extend-exclude = ["docs/_extensions"]
